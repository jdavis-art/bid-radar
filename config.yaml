output_dir: ./digest
data_dir: ./data
log_dir: ./logs
sources:
  bidnet:
    enabled: true
    cookie_file: ~/.bidnet-curl.txt
    base_url: https://www.bidnetdirect.com
    page_size: 100
    max_pages: 60
    pause_seconds: 1.0
    saved_search_ids: []        # set in config.local.yaml; empty = discover from the page
  publicpurchase:
    enabled: true
    cookie_file: ~/.publicpurchase-curl.txt
    base_url: https://www.publicpurchase.com
    regions: [CO, WY, UT]
    agency_pick: 'hous|housing authority|county|city of|town of|school'
    bid_pick: '\bhousing\b|\bhomes?\b|\bhouses?\b|residen|dwelling|apartment|modular|prefab|manufactured|factory|tiny|workforce|employee|attainable|affordable|duplex|townho|cabin|cottage|dormitor|lodg|\badu\b|accessory dwelling'
  samgov:
    enabled: true
    api_key: ""                 # SAM_API_KEY env overrides
    base_url: https://api.sam.gov/opportunities/v2/search
    keywords: ["design-build", "modular housing", "workforce housing", "manufactured housing"]
    naics: ["236116", "236117", "236220", "321991", "321992"]
    ptypes: ["o", "p", "k"]     # solicitation, presolicitation, combined synopsis
    lookback_days: 7
    limit: 1000
  prop123:
    # Colorado Prop 123 fund: applicant and selection lists, one lead per row. Awards, not bids.
    enabled: true
    base_url: https://coloradoaffordablehousingfinancingfund.com
    searches: ["Selections", "Applications"]
    min_date: "2025-07-01"      # FY25-26 onward; older lists are stale leads
    call_window_days: 90        # a row leaves the open digest this long after its list posts
scoring:
  exclude_title:
    - 'developer selection|co-developer|developer partner|ground lease|nofa|notice of funding|funding availability|rental assistance|tbra|needs assessment|study|strategy|linkage fee|software|consult|advisory|analytical|monitoring|compliance|outreach|case m|services provider|placement services|caregiving|point-in-time|encampment|abatement|demolition|deconstruction|renovation|rehabilitation|repair|stabilization|classroom|shade shelter|shed\b|casework|pharmacy|fiber optic|animal|pressure washing|bus shelter|pavement|parking|athletic|stadium|conveyance|ups system|amphitheater|flowmeter|tourist|lodging services|hearing officer|homeless outreach|substance'
    # Added 2026-09-06 after hand-labeling 145 rows (precision 0.24 -> 0.76, recall 0.95): services, operations,
    # program administration, trades, and non-housing 'house/home' titles.
    - '\bservices?\b|operations?\b|operation of|administration|management|voucher|\bloans?\b|trust funds?|assistance|support program|prevention|placement|habitability|behavioral|group home|foster|dcfs|dhhs|patient|stucco|window replacement|sound insulation|quieter home|resurfacing|landscap|cleaning|restoration|remodel|water (?:system|consolidation)|infrastructure|solar|solid waste|internet|security system|furnitur|gasket|tree house|instrument house|home organiz|home buyer|mobility home|vehicle|sweeper|restaurant|event space|broker|real estate|beddown|pedestrian|\bbridge\b|shelter (?:rooms|care|program|services)|emergency shelter|mass care|single wide|set-up of|relocation'
  not_housing_title:
    - 'warehouse|well ?house|pool ?house|green ?house|school ?house|field ?house|court ?house|club ?house|guard ?house|gate ?house|pump ?house|bath ?house|in-house|open house|home ?page|home ?land|homeless(?:ness)? (?:services|outreach|count)|residential (?:land|transparency|rehab|treatment|street)|animal|housing (?:needs|element|study|assessment|authority (?:software|training))'
  housing:
    - '\bhousing\b|\bhouses?\b(?! ?(?:keeping|hold))|\bhomes?\b|residen(?:ce|tial|t)|dwelling|apartment|modular|prefab|manufactured hous|\bcabins?\b|tiny|workforce hous|attainable|affordable hous|duplex|townho|villag|cottage|\blodg(?:e|ing)\b|dormitor|barrack|interim hous|transitional hous|\badus?\b|accessory dwelling|relocatable|man ?camp'
  location_points:
    Colorado: 2
    Wyoming: 2
    California: 1
    Arizona: 1
    Utah: 1
    New Mexico: 1
  boost:
    - 'modular|prefab|manufactured|tiny|workforce hous|staff(?:ing)? hous|employee.{0,20}hous|interim hous|relocatable|attainable'
  federal_bid_type: Federal Bids
  federal_note: federal (CAGE/SAM required)
  digest_min_score: 3
