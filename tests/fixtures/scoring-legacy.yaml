  - \bhousing\b|\bhouses?\b(?! ?(?:keeping|hold))|\bhomes?\b|residen(?:ce|tial|t)|dwelling|apartment|modular|prefab|manufactured hous|\bcabins?\b|tiny|workforce hous|attainable|affordable hous|duplex|townho|villag|cottage|\blodg(?:e|ing)\b|dormitor|barrack|shelter|interim hous|transitional hous|\badus?\b|accessory dwelling|relocatable|man ?camp
